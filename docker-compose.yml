services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tactlex
      POSTGRES_PASSWORD: tactlex
      POSTGRES_DB: tactlex
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tactlex -d tactlex"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - tactlex-postgres:/var/lib/postgresql/data
      - ./scripts/create-test-database.sql:/docker-entrypoint-initdb.d/10-test-database.sql:ro

volumes:
  tactlex-postgres:
