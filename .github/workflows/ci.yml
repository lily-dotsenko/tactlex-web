name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tactlex
          POSTGRES_PASSWORD: tactlex
          POSTGRES_DB: tactlex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tactlex -d tactlex_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://tactlex:tactlex@localhost:5432/tactlex_test?schema=public
      TEST_DATABASE_URL: postgresql://tactlex:tactlex@localhost:5432/tactlex_test?schema=public
      SESSION_PEPPER: ci-only-session-pepper-with-more-than-32-bytes
      ALLOWED_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      AUDIO_UPLOADS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run db:validate
      - run: npm run db:generate
      - run: npm run db:migrate:deploy
      - run: npm run db:seed
      - run: npm run content:validate
      - run: npm run db:seed
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=chromium
